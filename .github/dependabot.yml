version: 2
updates:
  # `uv` ecosystem bumps both pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      day: sunday
      interval: weekly
    labels:
      - chore
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      day: sunday
      interval: weekly
    labels:
      - chore
    groups:
      hooks:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      day: sunday
      interval: weekly
    labels:
      - chore
    # Ungrouped, five unmerged bumps hit dependabot's open-PR limit and it
    # stops proposing newer majors.
    groups:
      actions:
        patterns:
          - "*"
